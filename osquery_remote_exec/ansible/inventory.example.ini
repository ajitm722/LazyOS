# Standalone inventory — use this when running Ansible without Terraform.
# Copy to inventory.ini and edit for your target machine.
#
# Usage:
#   cp inventory.example.ini inventory.ini
#   ansible-playbook -i inventory.ini playbook.yml
#
# Supported OS values: ubuntu, debian, amazon-linux
# The role auto-detects the OS family via Ansible's setup module.

[lazyos_nodes]
your-machine-ip ansible_user=ubuntu ansible_os=debian
