# Standalone inventory — use this when running Ansible without Terraform.
# Copy to inventory.ini and edit for your target machine.
#
# Usage:
#   cp inventory.example.ini inventory.ini
#   ansible-playbook -i inventory.ini playbook.yml -k -K
#
# The -k flag asks for the SSH password (-K asks for the sudo password).
# If you've set up SSH keys, omit -k (but -K may still be needed).
#
# Architecture notes:
#   - amd64/x86_64: uses the osquery apt repo (Debian/Ubuntu) or yum repo (Amazon Linux)
#   - aarch64/arm64: downloads the tarball directly (no apt repo available)
#   Architecture is auto-detected by Ansible's setup module — no manual config needed.

[lazyos_nodes]
your-machine-ip ansible_user=ajit
